name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra test --group dev

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run default tier + mne-lsl cross-test
        # The mne_lsl-marked test is included; it skips gracefully if mne-lsl
        # provides no RDA client (see tests/test_cross_mne_lsl.py).
        run: uv run pytest -q -rs
