name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extra + ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run default tier + mne-lsl cross-test
        # The mne_lsl-marked test is included; it skips gracefully if mne-lsl
        # provides no RDA client (see tests/test_cross_mne_lsl.py).
        run: pytest -q -rs
